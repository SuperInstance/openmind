[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmind"
version = "0.1.0"
description = "Code induction engine — ingest repos, build vector models, decide execution strategy. Works standalone, as CLI, or in Jupyter."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "SuperInstance", email = "noreply@superinstance.dev"},
]
keywords = ["induction", "code-analysis", "vector", "tree-sitter", "ternary", "jupyter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Jupyter",
]

dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
    "appdirs>=1.4",
]

[project.optional-dependencies]
tree-sitter = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-javascript>=0.21",
]
jupyter = [
    "ipython>=8.0",
    "ipywidgets>=8.0",
]
embeddings = [
    "lancedb>=0.3",
    "litellm>=1.0",
]
full = [
    "openmind[tree-sitter,jupyter,embeddings]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
openmind = "openmind.cli:main"

[project.entry-points."ipython_magics"]
openmind = "openmind.jupyter.magic:OpenMindMagics"

[tool.setuptools.packages.find]
include = ["openmind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
